<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quiz interativo de Futebol Brasileiro — teste seus conhecimentos!">
    <title>Quiz de Futebol Brasileiro ⚽</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">

        <!-- Tela inicial -->
        <section id="start-screen" class="card screen active">
            <div class="ball-icon">⚽</div>
            <h1>Quiz de Futebol<br>Brasileiro</h1>
            <p class="subtitle">Teste seus conhecimentos sobre o futebol do Brasil em 8 perguntas!</p>
            <button id="start-btn" class="btn btn-primary">Começar o Quiz</button>
            <a href="gabarito.html" class="link-gabarito">Ver Gabarito</a>
        </section>

        <!-- Tela do quiz -->
        <section id="quiz-screen" class="card screen">
            <header class="quiz-header">
                <span id="question-counter" class="counter">Pergunta 1 de 8</span>
                <span id="score-live" class="score-pill">⭐ 0</span>
            </header>
            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
            <h2 id="question-text">Carregando pergunta...</h2>
            <div id="options" class="options"></div>
            <button id="next-btn" class="btn btn-primary hidden">Próxima →</button>
        </section>

        <!-- Tela de resultado -->
        <section id="result-screen" class="card screen">
            <div id="result-emoji" class="ball-icon">🏆</div>
            <h1 id="result-title">Fim de jogo!</h1>
            <p id="result-score" class="result-score">Você acertou 0 de 8</p>
            <p id="result-message" class="subtitle"></p>
            <button id="restart-btn" class="btn btn-primary">🔄 Reiniciar Quiz</button>
            <a href="gabarito.html" class="link-gabarito">Ver Gabarito</a>
        </section>

    </main>

    <footer class="footer">Feito com ⚽ para os apaixonados por futebol</footer>

    <script src="script.js"></script>
</body>
</html>
